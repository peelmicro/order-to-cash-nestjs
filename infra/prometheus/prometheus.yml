# Order-To-Cash — Prometheus scrape configuration.
#
# Phase 4 (this file): scrape the OTel Collector's Prometheus exporter only.
# Phase 22 wires up dashboards; the six application services below arrive in
# phase 23 (docker-compose.apps.yml) and are left commented as placeholders
# so this file does not need re-authoring later.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

