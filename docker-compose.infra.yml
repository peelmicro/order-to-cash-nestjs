# Order-To-Cash — infrastructure-only compose file (phase 4).
#
# Brings up MySQL, MongoDB, Kafka (KRaft), Redpanda Console, NATS (core-only),
# the OTel Collector, Jaeger v2, Prometheus, Grafana and n8n so later phases
# have somewhere to connect. NO application containers here — those arrive in
# phase 23 (docker-compose.apps.yml). SonarQube is behind the `sonar` profile
# because it costs ~1.5 GB RAM and is not needed for every session.
#
# Usage: see the `dc:*` scripts in package.json, e.g.
#   pnpm dc:up:infra    # docker compose -f docker-compose.infra.yml up -d
#   pnpm dc:up:sonar    # ... --profile sonar up -d sonarqube

name: otc

networks:
  otc-net:
    name: otc-net
    driver: bridge

volumes:
  mysql_data:
  mongodb_data:
  kafka_data:
  n8n_data:
  grafana_data:
  prometheus_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

services:
  # ── MySQL — one instance, five logical databases (database-per-service) ──
  # otc_notifications joined in the notifications_service re-review (N1/N2):
  # a durable processed_events ledger, the same canonical shape orders/
  # fulfillment/billing already use, on its own logical database — never a
  # shared schema, never a cross-database join (CLAUDE.md § Database per
  # service).
  mysql:
    image: mysql:8.4.11
    container_name: otc-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-otc_root_dev_password}
      MYSQL_USER: ${MYSQL_USER:-otc_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-otc_app_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-otc_orders}
      # Read by infra/mysql/init/01-create-databases.sh (a .sh init script
      # runs with the full container environment, unlike .sql — see
      # progress/review defect D5).
      MYSQL_DB_ORDERS: ${MYSQL_DB_ORDERS:-otc_orders}
      MYSQL_DB_FULFILLMENT: ${MYSQL_DB_FULFILLMENT:-otc_fulfillment}
      MYSQL_DB_BILLING: ${MYSQL_DB_BILLING:-otc_billing}
      MYSQL_DB_NOTIFICATIONS: ${MYSQL_DB_NOTIFICATIONS:-otc_notifications}
      # MYSQL_DB_N8N intentionally removed here (review fix D4): n8n has
      # never connected to this database — see the n8n: service comment
      # block below and progress/impl_n8n_workflows.md, "Review fixes".
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - otc-net
    healthcheck:
      # MUST be a TCP ping, never `-h localhost` (which the MySQL client
      # resolves to the Unix socket). On a first boot with an empty data
      # directory the entrypoint runs a *temporary* server that listens on the
      # socket ONLY while it executes /docker-entrypoint-initdb.d, then stops
      # it and starts the real server on TCP 3306. A socket ping therefore
      # reports healthy during that init window, Compose releases everything
      # gated on `service_healthy`, and the four *-migrate jobs — which connect
      # over TCP to mysql:3306 — die with ECONNREFUSED. Forcing --protocol=TCP
      # makes the check unsatisfiable until the real network listener accepts.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 --protocol=TCP -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── MongoDB — read models ────────────────────────────────────────────────
  mongodb:
    image: mongo:8.3.8
    container_name: otc-mongodb
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-otc_mongo_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-otc_mongo_dev_password}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - otc-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ── Kafka — KRaft mode, single node, no ZooKeeper ────────────────────────
  # Dual listener: PLAINTEXT (internal, container-to-container on kafka:29092)
  # and EXTERNAL (host access on localhost:9092). CONTROLLER is KRaft-only
  # and never exposed.
  kafka:
    image: apache/kafka:4.3.1
    container_name: otc-kafka
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:${KAFKA_INTERNAL_PORT:-29092},CONTROLLER://:${KAFKA_CONTROLLER_PORT:-9093},EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_INTERNAL_HOST:-kafka}:${KAFKA_INTERNAL_PORT:-29092},EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@${KAFKA_INTERNAL_HOST:-kafka}:${KAFKA_CONTROLLER_PORT:-9093}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Declared explicitly rather than relying on the image's default
      # /tmp/kafka-logs — the mount below MUST match this exactly, or the
      # broker persists nothing to the named volume (see progress/review
      # defect D1: apache/kafka:4.3.1 is NOT the Confluent cp-kafka image and
      # does not use /tmp/kraft-combined-logs).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - otc-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${KAFKA_INTERNAL_PORT:-29092} >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ── kafka-init — one-shot: creates the Kafka fact topics + .dlq companions
  #    declared in specs/shared/asyncapi.yaml. The topic list is PARSED from
  #    that spec at run time (infra/kafka/create-topics.sh), never retyped
  #    here — see the script for the full rationale. Idempotent: re-running
  #    (`pnpm kafka:topics`, or `docker compose up` again) creates nothing new
  #    and re-asserts the broker's otc.* topics still match the spec exactly.
  #    restart: "no" — this is a job, not a long-running service. ───────────
  kafka-init:
    build:
      context: ./infra/kafka
      dockerfile: Dockerfile
    image: otc-kafka-init:4.3.1
    pull_policy: build
    container_name: otc-kafka-init
    restart: "no"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      ASYNCAPI_SPEC_PATH: /specs/asyncapi.yaml
      KAFKA_BOOTSTRAP_SERVER: "${KAFKA_INTERNAL_HOST:-kafka}:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
    volumes:
      - ./specs/shared/asyncapi.yaml:/specs/asyncapi.yaml:ro
    networks:
      - otc-net
    depends_on:
      kafka:
        condition: service_healthy

  # ── Redpanda Console — Kafka UI, points at the internal listener ────────
  kafka-console:
    image: redpandadata/console:v3.10.0
    container_name: otc-kafka-console
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      KAFKA_BROKERS: "${KAFKA_INTERNAL_HOST:-kafka}:${KAFKA_INTERNAL_PORT:-29092}"
    ports:
      - "${REDPANDA_CONSOLE_HOST_PORT:-8080}:8080"
    networks:
      - otc-net
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/admin/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── kafka-exporter — observability_dashboards (phase 22)'s consumer-lag
  #    decision: NOT instrumented in-app (no service under `apps/` computes
  #    or reports its own consumer lag — a genuine gap the phase found,
  #    confirmed by grep before this container was added). Rather than add
  #    ad hoc lag bookkeeping to four services' Kafka consumer paths (a much
  #    larger, application-code change for a phase whose remit is dashboards
  #    and config), this is the broker's OWN truth: `kafka_consumergroup_lag`
  #    is `danielqsj/kafka-exporter` querying the real committed offsets of
  #    each consumer group (`orders.saga`, `projector`, `notifications`)
  #    against each fact topic's real high-water mark via the Kafka admin
  #    API — the actual, textbook definition of consumer lag, not a proxy
  #    metric relabelled to sound like one. `--kafka.server` points at the
  #    SAME internal listener every service already uses (`kafka:29092`).
  #    Measured resource cost: 7.4 MiB RSS, 0.00% CPU at rest — negligible
  #    against Grafana's 256 MiB and Prometheus' 33 MiB (D3,
  #    progress/review_observability_dashboards.md), which is what makes
  #    this always-on container the right call over per-service bookkeeping.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: otc-kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=${KAFKA_INTERNAL_HOST:-kafka}:${KAFKA_INTERNAL_PORT:-29092}"]
    ports:
      - "${KAFKA_EXPORTER_HOST_PORT:-9308}:9308"
    networks:
      - otc-net
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9308/metrics"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── NATS — RPC transport, core-only (NO JetStream: durability is Kafka's
  #    job, see specs/shared/asyncapi.yaml). Monitoring on 8222. ────────────
  nats:
    image: nats:2.14.5-alpine
    container_name: otc-nats
    restart: unless-stopped
    command: ["-p", "4222", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_HOST_PORT:-4222}:4222"
      - "${NATS_MONITOR_HOST_PORT:-8222}:8222"
    networks:
      - otc-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── OTel Collector — receives OTLP from every service, forwards traces to
  #    Jaeger, exposes a Prometheus scrape endpoint. Custom Dockerfile only
  #    adds a static busybox binary so the exec healthcheck has something to
  #    run (the upstream image is distroless — no shell, no wget). ─────────
  otel-collector:
    build:
      context: ./infra/otel-collector
      dockerfile: Dockerfile
    image: otc-otel-collector:0.159.0
    # Forces a rebuild on every `up`/`pull` instead of silently reusing a
    # stale local tag if the Dockerfile or its pinned FROM ever changes
    # (see review defect D4).
    pull_policy: build
    container_name: otc-otel-collector
    restart: unless-stopped
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_GRPC_HOST_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_HOST_PORT:-4318}:4318"
    networks:
      - otc-net
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── Jaeger v2 — built on the OTel Collector itself. Also listens on OTLP
  #    4317/4318 internally, but those are NOT mapped to the host: the
  #    otel-collector already owns those host ports. Only the UI (16686) is
  #    published. Traces flow: services -> otel-collector -> jaeger. ────────
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: otc-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686"
    networks:
      - otc-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── Prometheus — scrapes the OTel Collector now; application services are
  #    commented placeholders until phase 23. ──────────────────────────────
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: otc-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks:
      - otc-net
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      # /-/ready is the readiness contract (has loaded config + storage is
      # ready to be queried); /-/healthy only proves the process is alive.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Grafana — Prometheus + Jaeger datasources provisioned, PLUS (phase 22,
  #    observability_dashboards) the committed "Order To Cash — Overview"
  #    dashboard, auto-provisioned via `provisioning/dashboards/
  #    dashboards.yml`'s `type: file` provider reading
  #    `infra/grafana/dashboards/*.json` — a SECOND bind mount below (the
  #    first, `./infra/grafana/provisioning`, only ever covered the
  #    `provisioning/` tree itself; the dashboard JSON the provider `path:`
  #    points at lives outside it, one level up in `infra/grafana/`, and
  #    needs its own mount into the SAME `/var/lib/grafana/dashboards` path
  #    referenced there). Host port pinned to 3030 to avoid clashing with
  #    dev servers that default to 3000. ────────────────────────────────────
  grafana:
    image: grafana/grafana:13.2.0
    container_name: otc-grafana
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-otc_grafana_dev_password}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3030}:3000"
    networks:
      - otc-net
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ── n8n — workflow automation, talks only to the Gateway REST API (never
  #    to a database or broker directly — see specs/shared/n8n-workflows.md).
  #
  #    SQLite, not MySQL (review fix D4, progress/impl_n8n_workflows.md,
  #    "Review fixes"). n8n 2.36.2's config schema only accepts `sqlite` or
  #    `postgresdb` — MySQL support was dropped upstream in n8n's 2.0
  #    breaking changes — so DB_TYPE is set to `sqlite` below, honestly, and
  #    n8n persists to its own SQLite file inside the `n8n_data` volume. That
  #    volume survives container restarts/recreates, so workflow state and
  #    activation are NOT lost. A real MySQL-backed n8n would mean retargeting
  #    at `postgresdb` (a different engine, still not MySQL) or pinning an
  #    older n8n release; neither is a workflow-authoring decision, so this
  #    stays on SQLite. Do not put `mysqldb` back here — that value doesn't
  #    exist in n8n 2.x's schema and made every boot, import and export print
  #    "Invalid value for DB_TYPE ... Falling back to default value" as
  #    routine output, drowning out real errors the same way.
  #
  #    No env_file (review fix D3, progress/impl_n8n_workflows.md, "Review
  #    fixes"). `env_file: [.env]` used to hand this container every secret
  #    in `.env` — MYSQL_ROOT_PASSWORD, JWT_SECRET, a real SMTP_PASSWORD
  #    (MAILTRAP_PASSWORD at the time, before the Mailpit migration removed
  #    the vendor credential outright — progress/impl_mailpit_migration.md) —
  #    verified present with `docker exec otc-n8n env`. Combined with
  #    N8N_BLOCK_ENV_ACCESS_IN_NODE=false (genuinely required — see below)
  #    and the unauthenticated-by-default UI on a published port, any Code
  #    node authored here could read and exfiltrate them, which
  #    specs/shared/n8n-workflows.md §1 states must be structurally
  #    impossible ("they hold no database credential and no broker
  #    credential, because they have nothing to connect to"). The
  #    `environment:` block below is an explicit allowlist of exactly the
  #    values the four committed workflows read via `$env.*` — every
  #    OTC_*/GATEWAY_OPERATOR_*/ORDER_GENERATOR_*/PAYMENT_ROBOT_*/
  #    STOCK_REPLENISH_*/BURST_*/N8N_WORKFLOWS_ENABLED variable in
  #    specs/shared/n8n-workflows.md §2.5 and nothing this container has no
  #    business holding. N8N_BLOCK_ENV_ACCESS_IN_NODE stays `false` — the
  #    workflows only work by reading their tuning knobs via `$env`, and
  #    flipping it to `true` would break all four — so the containment is
  #    "the container's own env has nothing worth reading", not "Code nodes
  #    can't read $env". OTC_GATEWAY_URL is overridden to the in-network
  #    service name per specs/shared/n8n-workflows.md §1 ("Gateway REST API
  #    only") — `.env`'s own default is host-oriented for tools run outside a
  #    container, same "outside vs inside compose" split as ORDERS_DB_HOST
  #    et al.
  n8n:
    image: n8nio/n8n:2.36.2
    container_name: otc-n8n
    restart: unless-stopped
    # profiles: n8n_workflows (phase 20) — omit this profile entirely to
    # verify the stack does not depend on the workflow engine at all
    # (specs/shared/n8n-workflows.md §7.1's "no workflow engine at all"
    # row): `pnpm dc:up:infra:no-n8n` / `pnpm dc:up:apps:no-n8n` start
    # everything EXCEPT n8n and n8n-init. The default `dc:up:infra` /
    # `dc:up:apps` scripts pass `--profile n8n` so existing behaviour (n8n
    # present) is unchanged for everyone not deliberately testing removal.
    profiles: ["n8n"]
    environment:
      TZ: ${TZ:-Europe/Madrid}
      GENERIC_TIMEZONE: ${TZ:-Europe/Madrid}
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-otc_n8n_dev_encryption_key_change_me}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-otc_n8n_dev_password}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5678}/
      N8N_RUNNERS_ENABLED: "true"
      # n8n 2.x blocks $env access from Code nodes/expressions by default —
      # every workflow here reads its tunables via $env.* (see header note).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # In-network Gateway address — overrides .env's host-oriented default
      # (same split as ORDERS_DB_HOST/MONGO_HOST/etc across this file).
      OTC_GATEWAY_URL: "http://gateway:${GATEWAY_PORT:-3001}"
      OTC_REQUEST_TIMEOUT_MS: ${OTC_REQUEST_TIMEOUT_MS:-10000}
      # The one operator identity shared by a human, the UI and every demo
      # workflow (feature 25) — no separate n8n-only login.
      GATEWAY_OPERATOR_USERNAME: ${GATEWAY_OPERATOR_USERNAME:-operator}
      GATEWAY_OPERATOR_PASSWORD: ${GATEWAY_OPERATOR_PASSWORD:-otc_operator_dev_password_change_me}
      N8N_WORKFLOWS_ENABLED: ${N8N_WORKFLOWS_ENABLED:-true}
      # Workflow 1 — order generator (specs/shared/n8n-workflows.md §3.4).
      ORDER_GENERATOR_ENABLED: ${ORDER_GENERATOR_ENABLED:-true}
      ORDER_GENERATOR_INTERVAL_SECONDS: ${ORDER_GENERATOR_INTERVAL_SECONDS:-45}
      ORDER_GENERATOR_ORDERS_PER_RUN: ${ORDER_GENERATOR_ORDERS_PER_RUN:-1}
      ORDER_GENERATOR_COMPENSATION_RATIO: ${ORDER_GENERATOR_COMPENSATION_RATIO:-0.15}
      ORDER_GENERATOR_MAX_LINES: ${ORDER_GENERATOR_MAX_LINES:-4}
      ORDER_GENERATOR_MAX_UNITS: ${ORDER_GENERATOR_MAX_UNITS:-10}
      ORDER_GENERATOR_RETAILERS: ${ORDER_GENERATOR_RETAILERS:-}
      ORDER_GENERATOR_COMPANIES: ${ORDER_GENERATOR_COMPANIES:-}
      ORDER_GENERATOR_CATALOG_TTL_SECONDS: ${ORDER_GENERATOR_CATALOG_TTL_SECONDS:-600}
      # Workflow 2 — payment robot (specs/shared/n8n-workflows.md §4.3).
      PAYMENT_ROBOT_ENABLED: ${PAYMENT_ROBOT_ENABLED:-true}
      PAYMENT_ROBOT_INTERVAL_SECONDS: ${PAYMENT_ROBOT_INTERVAL_SECONDS:-120}
      PAYMENT_AGE_MINUTES: ${PAYMENT_AGE_MINUTES:-2}
      PAYMENT_ROBOT_BATCH_SIZE: ${PAYMENT_ROBOT_BATCH_SIZE:-10}
      PAYMENT_ROBOT_RETAILERS: ${PAYMENT_ROBOT_RETAILERS:-}
      # Workflow 3 — stock replenishment (specs/shared/n8n-workflows.md §5.3).
      STOCK_REPLENISH_ENABLED: ${STOCK_REPLENISH_ENABLED:-true}
      STOCK_REPLENISH_INTERVAL_SECONDS: ${STOCK_REPLENISH_INTERVAL_SECONDS:-300}
      STOCK_REPLENISH_TOP_UP_UNITS: ${STOCK_REPLENISH_TOP_UP_UNITS:-100}
      STOCK_REPLENISH_BATCH_SIZE: ${STOCK_REPLENISH_BATCH_SIZE:-50}
      STOCK_REPLENISH_COMPANIES: ${STOCK_REPLENISH_COMPANIES:-}
      # Workflow 4 — burst, manual webhook (specs/shared/n8n-workflows.md §6.3).
      BURST_ENABLED: ${BURST_ENABLED:-true}
      BURST_ORDER_COUNT: ${BURST_ORDER_COUNT:-20}
      BURST_CONCURRENCY: ${BURST_CONCURRENCY:-5}
      BURST_COMPENSATION_RATIO: ${BURST_COMPENSATION_RATIO:-0.20}
      BURST_WEBHOOK_PATH: ${BURST_WEBHOOK_PATH:-otc-burst}
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # The four committed demo workflows (n8n_workflows, phase 20) —
      # `pnpm n8n:import`/`pnpm n8n:export` read/write this same mount from
      # inside the container, so the committed JSON in n8n/workflows/ IS
      # what n8n itself produces (see scripts/import-n8n-workflows.sh /
      # scripts/export-n8n-workflows.sh).
      - ./n8n/workflows:/home/node/workflows
    networks:
      - otc-net
    # No depends_on: mysql (review fix D4) — this service never contacts
    # MySQL; see the SQLite note above.
    healthcheck:
      # /healthz/readiness — n8n's own DB (SQLite, see above) and startup
      # readiness. Not a MySQL check; this service has no MySQL connection.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz/readiness"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ── n8n-init — one-shot: imports the four committed demo workflows
  #    (n8n/workflows/*.json) on every `docker compose up`, same
  #    "restart: no, depends_on: service_healthy" one-shot shape as
  #    kafka-init above. Uses the SAME image as the main `n8n` service (no
  #    custom Dockerfile needed — the CLI import command and a POSIX shell
  #    are already in the base image) and shares its `n8n_data` volume, so
  #    it writes into the exact same SQLite store the running n8n process
  #    reads (see the `n8n:` service's SQLite comment above — DB_TYPE is
  #    `sqlite` here too, for the same reason). Idempotent: importing a
  #    workflow with the same `id` overwrites it in place, so re-running this
  #    on every `up` just re-asserts the four committed workflows match the
  #    repo — never a duplicate. Gated by N8N_WORKFLOWS_ENABLED (see
  #    infra/n8n/import-workflows-on-startup.sh and
  #    specs/shared/n8n-workflows.md §7.1's "all workflows off" row). Always
  #    leaves every workflow INACTIVE regardless of that flag or of the
  #    committed JSON's own `active` field — see
  #    scripts/import-n8n-workflows.sh's header and progress/impl_n8n_
  #    workflows.md for why true auto-ACTIVATION isn't cleanly achievable on
  #    this n8n version without an extra restart, and is intentionally not
  #    attempted here.
  #
  #    No env_file here either (review fix D3) — this one-shot container only
  #    imports workflow JSON; N8N_ENCRYPTION_KEY and N8N_WORKFLOWS_ENABLED are
  #    the only two values import-workflows-on-startup.sh reads.
  n8n-init:
    image: n8nio/n8n:2.36.2
    container_name: otc-n8n-init
    restart: "no"
    profiles: ["n8n"]
    environment:
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-otc_n8n_dev_encryption_key_change_me}
      N8N_WORKFLOWS_ENABLED: ${N8N_WORKFLOWS_ENABLED:-true}
    entrypoint: ["/bin/sh", "/import-workflows-on-startup.sh"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro
      - ./infra/n8n/import-workflows-on-startup.sh:/import-workflows-on-startup.sh:ro
    networks:
      - otc-net
    depends_on:
      n8n:
        condition: service_healthy

  # ── Mailpit — self-hosted SMTP sink + web inbox for outbound notification
  #    emails, replacing Mailtrap (leader decision, progress/impl_mailpit_
  #    migration.md). Mailtrap's Email Sandbox free tier is 50 test
  #    emails/month; this system sends ~4 per order, so the quota was
  #    exhausted and 728 facts were dead-lettered before that was noticed
  #    (progress/review_n8n_workflows.md). Beyond the quota: the adapter is
  #    generic nodemailer-over-SMTP — Mailtrap demonstrates nothing Mailpit
  #    does not, same code, different host; it requires an account and
  #    credentials before anyone cloning this repo can run the stack; and
  #    MAILTRAP_PASSWORD was one of the secrets leaked into the n8n
  #    container (see the `n8n:` service comment above). Mailpit gives the
  #    same demo artefact — a real inbox with rendered emails — with no
  #    account, no quota and no secret: `apps/notifications` still speaks
  #    plain SMTP via nodemailer (apps/notifications/src/infrastructure/
  #    notification/smtp-notification-sender.ts) — nothing vendor-specific,
  #    SMTP_HOST/SMTP_PORT can point it at any SMTP provider instead,
  #    Mailtrap included (.env.example § SMTP). Default credentials
  #    (`SMTP_USER=mailpit`/`SMTP_PASSWORD=mailpit`) are accepted as-is —
  #    Mailpit does not enforce SMTP AUTH by default — so the stack sends
  #    real mail on first `docker compose up`, no signup required. ─────────
  mailpit:
    image: axllent/mailpit:v1.27.5
    container_name: otc-mailpit
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Madrid}
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
    networks:
      - otc-net
    healthcheck:
      # Mailpit's own built-in healthcheck endpoint (`mailpit readyz`
      # subcommand's underlying HTTP route) — same "CMD wget --spider"
      # shape every other HTTP-fronted service in this file uses.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── SonarQube — opt-in only: `pnpm dc:up:sonar` (profile "sonar"). Not
  #    started by `pnpm dc:up:infra` — ~1.5 GB RAM is too much to pay by
  #    default every session. ───────────────────────────────────────────────
  sonarqube:
    image: sonarqube:26.8.0.126808-community
    container_name: otc-sonarqube
    restart: unless-stopped
    profiles: ["sonar"]
    environment:
      TZ: ${TZ:-Europe/Madrid}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ports:
      - "${SONARQUBE_HOST_PORT:-9000}:9000"
    networks:
      - otc-net
    healthcheck:
      # Not just HTTP 200 — /api/system/status returns 200 with
      # {"status":"STARTING"} for ~90s while Elasticsearch and the compute
      # engine boot. Assert the body actually says UP (see review defect D2).
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
