# SonarQube scanner configuration — phase 21 (sonarqube_quality_gates).
#
# SonarQube itself is opt-in (`pnpm dc:up:sonar`, "sonar" compose profile,
# docker-compose.infra.yml) — it costs ~1.5-2.3 GB of RAM on top of the rest
# of the stack, so it is never started by `pnpm dc:up:infra`. This file only
# configures what a scan WOULD analyse; it has no effect unless you actually
# run a scanner against a running SonarQube instance (see README.md
# "SonarQube" section for the exact commands).
#
# `pnpm quality`'s coverage gate (root package.json's `test:coverage` step,
# and every workspace's own `vitest.config.mts` `coverage.thresholds`) is
# the enforced gate and works independently of SonarQube ever running —
# this file is a genuinely optional, additional code-quality view on top,
# never a substitute.

sonar.projectKey=order-to-cash-nestjs
sonar.projectName=Order To Cash (NestJS)
sonar.sourceEncoding=UTF-8

# A single-project scan across the whole pnpm monorepo (no sonar.modules
# split — every workspace already shares one root tsconfig project graph
# and one lint config, so per-module analysis buys nothing here). `sources`
# and `tests` deliberately overlap: `sonar.test.inclusions` below is what
# actually classifies a matched file as a test rather than main source, the
# documented way to scan main+test code from the same directories without
# a multi-module setup.
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.spec.ts,**/*.integration.spec.ts

# node_modules/dist/build output/generated code never gets a quality
# opinion here — same reasoning packages/contracts/vitest.config.mts
# already documents for excluding src/generated/** from the coverage gate
# itself ("do not chase coverage numbers on generated code"), extended to
# every workspace's own build output.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.nuxt/**,\
  **/.output/**,\
  **/coverage/**,\
  **/*.d.ts,\
  packages/contracts/src/generated/**

# Every workspace's vitest.config.mts coverage block already emits
# ['text', 'lcov'] (checked across all ten: apps/{orders,billing,
# fulfillment,gateway,notifications,projector,seed,web},
# packages/{shared-kernel,contracts} — none needed a reporter added). Run
# `pnpm run test:coverage` first so every coverage/lcov.info below exists;
# a scan against a stale or missing lcov.info silently reports 0% for that
# workspace rather than failing, so freshness is on the person running the
# scan, not enforced by the scanner itself.
sonar.javascript.lcov.reportPaths=\
  apps/orders/coverage/lcov.info,\
  apps/billing/coverage/lcov.info,\
  apps/fulfillment/coverage/lcov.info,\
  apps/gateway/coverage/lcov.info,\
  apps/notifications/coverage/lcov.info,\
  apps/projector/coverage/lcov.info,\
  apps/seed/coverage/lcov.info,\
  apps/web/coverage/lcov.info,\
  packages/shared-kernel/coverage/lcov.info,\
  packages/contracts/coverage/lcov.info

# Mirrors apps/seed/vitest.config.mts's coverage.exclude list exactly, for
# the identical reason: those five files (the three Drizzle/MySQL writers,
# verify.ts, index.ts) have zero LCOV records under the unit-only
# `pnpm test:coverage` run they are excluded from — Sonar treats a source
# file with no LCOV record as 0% covered, so without this a scan would
# report them at 0% and could fail a Sonar quality gate on exactly the code
# the local gate has already, defensibly excluded (see the vitest config's
# own comment for the per-file reasoning, including the one open item:
# verify.ts's throw-guard branches are a genuine, documented coverage gap,
# not a laundered one). Keeping the two lists in sync is manual; if
# apps/seed/vitest.config.mts's coverage.exclude ever changes, update this
# too.
sonar.coverage.exclusions=\
  apps/seed/src/index.ts,\
  apps/seed/src/verify.ts,\
  apps/seed/src/writers/orders-db.writer.ts,\
  apps/seed/src/writers/fulfillment-db.writer.ts,\
  apps/seed/src/writers/billing-db.writer.ts

# First-scan false positive — typescript:S7739 "Do not add `then` to an
# object" (9 issues, all in apps/projector/src/infrastructure/persistence/
# legacy-document-backfill.ts:36-44). The rule exists to catch accidental
# "thenables" — an object with a `then` key that silently breaks Promise
# resolution/`await`. The nine flagged objects are entries of a MongoDB
# `$switch` aggregation expression (`{ case: {...}, then: <rank> }`), where
# `then` is MongoDB's OWN required query-document syntax, not a callback —
# this object is sent to the driver as a query document and is never
# `await`ed or passed through a Promise chain. Structurally the rule fires
# correctly (the object literal does have a `then` key); contextually it
# does not apply (nothing here is or could become a thenable in the
# Promise sense). Checked the rest of the repo for the same pattern
# (`grep -rn 'then:' apps --include='*.ts'`, and specifically
# delta-to-pipeline.ts, which builds similar aggregation-pipeline
# expressions in the same file's neighbourhood) — no other `$switch`/`then`
# aggregation branch exists anywhere else today. Scoped to the whole file
# (not the nine individual lines) so a future branch added to this same
# $switch is covered by the same, written reasoning rather than needing a
# fresh per-line suppression each time.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7739
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/projector/src/infrastructure/persistence/legacy-document-backfill.ts

# sonar.host.url and the auth token are deliberately NOT set here — a token
# is a secret and a host URL varies by environment. Pass both on the
# scanner invocation instead (README.md "SonarQube" section):
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$SONAR_TOKEN
