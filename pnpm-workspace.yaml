packages:
  - apps/*
  - packages/*

# esbuild's postinstall just downloads its own platform binary — required by
# Vitest and tsx, both of which are esbuild-based. Safe to allow.
# cpu-features/protobufjs/ssh2 are transitive deps of dockerode (via
# testcontainers/@testcontainers/mysql — see db_orders): dockerode's Docker
# Engine API client, native crypto accel for ssh2 and grpc/protobuf codegen
# respectively. None run anything project-specific; approved so
# Testcontainers works the same as it would outside this sandboxed install.
allowBuilds:
  # Anonymous install-telemetry postinstall script (transitive dep pulled in
  # by gateway_rest_auth's new packages) — not project-relevant, denied.
  '@scarf/scarf': false
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
  vue-demi: true

# Shared devDependency versions for every workspace member. Referenced from
# package.json files as "catalog:" so the whole monorepo upgrades NestJS,
# TypeScript, Vitest, etc. in one place instead of drifting per app.
# See progress/impl_monorepo_scaffold.md for the TypeScript 7 vs 5.9 decision.
catalog:
  typescript: 5.9.3
  "@types/node": ^24.13.3
  vitest: ^4.1.11
  "@vitest/coverage-v8": ^4.1.11
  tsx: ^4.23.12
  dotenv-cli: ^10.0.0
  "@nestjs/common": ^11.2.1
  "@nestjs/core": ^11.2.1
  "@nestjs/platform-express": ^11.2.1
  "@nestjs/testing": ^11.2.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  vue-tsc: ^3.3.10
  # Persistence (apps/orders, apps/fulfillment, apps/billing — one MySQL
  # database per service, see CLAUDE.md § Database per service). Pinned in
  # the catalog so every service's Drizzle stack upgrades together.
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  mysql2: ^3.23.3
  # Testcontainers — integration tests spin up the SAME pinned image
  # (mysql:8.4.11) the compose file uses, never a mocked broker/store.
  testcontainers: ^12.1.0
  "@testcontainers/mysql": ^12.1.0
  # MongoDB read model (apps/projector, apps/seed) — the official driver,
  # never mocked. @testcontainers/mongodb pinned to the same major as the
  # rest of the testcontainers family above.
  mongodb: ^7.5.0
  "@testcontainers/mongodb": ^12.1.0
  # Kafka fact-stream producer (apps/orders — the outbox relay,
  # outbox_and_idempotency feature). @testcontainers/kafka pinned to the
  # same major as the rest of the testcontainers family above; the
  # container it drives is pinned separately, to apache/kafka:4.3.1, the
  # same tag docker-compose.infra.yml uses (design.md §9).
  kafkajs: ^2.2.4
  "@testcontainers/kafka": ^12.1.0
  # NATS RPC transport (apps/orders — orders_acceptance feature: the
  # `orders.create` responder and the `fulfillment.stock.check` client).
  # `@nestjs/microservices` for the inbound `@MessagePattern` responder only
  # (design.md-equivalent asymmetry to the outbox relay's kafkajs-direct
  # producer, see kafka-fact-publisher.ts) — the outbound stock-check call
  # uses the plain `nats` client directly for explicit per-call timeout
  # control. `@testcontainers/nats` pinned to the same major as the rest of
  # the testcontainers family above; the container it drives is pinned
  # separately, to nats:2.14.5-alpine, the same tag docker-compose.infra.yml
  # uses.
  "@nestjs/microservices": ^11.2.1
  nats: ^2.29.3
  "@testcontainers/nats": ^12.1.0
  # order_saga_orchestrator (feature 16) — the application-layer command/
  # event bus and the `@Saga` construct the durable orchestrator composes
  # with (design.md §5.5, §9; gate ruling, progress/spec_order_saga_orchestrator.md
  # §5, open point 3 overruled): every service's application layer now uses
  # `CommandBus`/`QueryBus`/`EventBus` handlers per CLAUDE.md. Matches the
  # Nest 11 line already pinned above.
  "@nestjs/cqrs": ^11.0.3
  # DTO validation at the presentation boundary (CLAUDE.md's own description
  # of the presentation layer: "@MessagePattern NATS ... DTOs,
  # class-validator").
  class-validator: ^0.14.2
  class-transformer: ^0.5.1
  # DI-metadata divergence fix (review_orders_acceptance.md, cross-cutting
  # item folded into feature 15's fix pass): `tsconfig.base.json` sets
  # `emitDecoratorMetadata: true`, so `pnpm build` (tsc) emits
  # `design:paramtypes` — but `tsx watch` is esbuild-based and does NOT
  # implement that compiler flag, so a bare-type constructor-injected
  # provider that resolves correctly under `pnpm start` silently resolves
  # to `undefined` under `pnpm dev:*`. `tsc-watch` runs the SAME `tsc`
  # compiler `pnpm build` uses, in watch mode, restarting `node` on every
  # successful recompilation — so `pnpm dev:*` and `pnpm start` now compile
  # with the identical compiler and can no longer disagree on decorator
  # metadata. All six NestJS services (orders, fulfillment, billing,
  # gateway, notifications, projector) use it; `apps/web` (Nuxt/Vite, not
  # NestJS) and `apps/seed` (plain `tsx`, no DI container) are unaffected
  # and keep their existing dev scripts.
  tsc-watch: ^7.2.1
  # notifications_service (feature 23) — the SMTP adapter's client (Mailpit
  # locally since the Mailpit migration, any SMTP provider elsewhere,
  # Mailtrap included — provider-neutral by construction).
  # `@types/nodemailer` is versioned independently of `nodemailer` itself at
  # DefinitelyTyped (same non-1:1 numbering as `@types/node` vs `node`); 8.x
  # is the current types major for the installed 9.x runtime package.
  nodemailer: ^9.0.5
  "@types/nodemailer": ^8.0.1
  # gateway_rest_auth (feature 25) — the REST/BFF surface. `jsonwebtoken`
  # issues/verifies the single operator's bearer token directly (same
  # "plain client, explicit control" ethos as `nats-client.ts`/
  # `mongo-client.ts` elsewhere in this repo — no `@nestjs/passport`
  # strategy indirection for a single, statically-configured identity).
  # `swagger-ui-express` renders `specs/shared/openapi.yaml` verbatim at
  # `GET /docs` — the contract IS the documentation, so nothing is
  # regenerated from decorators. `js-yaml` parses that same file, both to
  # serve it and for the contract-drift test (group E) that walks it
  # against the running app's actual routes. `supertest` is the HTTP
  # client the black-box API tests use against the Gateway (CLAUDE.md
  # Testing conventions).
  jsonwebtoken: ^9.0.2
  "@types/jsonwebtoken": ^9.0.7
  swagger-ui-express: ^5.0.1
  "@types/swagger-ui-express": ^4.1.7
  js-yaml: ^4.1.0
  "@types/js-yaml": ^4.0.9
  supertest: ^7.1.1
  "@types/supertest": ^6.0.2
  # `@types/express` — the gateway's own exception filter
  # (presentation/problem-json.filter.ts) types the raw `Response` it
  # writes the RFC 9457 problem+json body onto. `@nestjs/platform-express`
  # depends on `express` itself already; only the TYPES package needs an
  # explicit workspace declaration under pnpm's strict `node_modules`.
  "@types/express": ^5.0.6
  # observability_reliability (feature 27, A5 — R57/OR4, design.md §4.3/§6).
  # `sdk-node`/the exporters/`instrumentation-http` are the "experimental"
  # release train (0.221.x); `api`/`resources`/`semantic-conventions` are
  # the stable train (1.x/2.x/1.x respectively) — both trains are pinned to
  # the versions that were mutually current (and peer-dependency-compatible:
  # `sdk-node@0.221.0` requires `api` `>=1.3.0 <1.10.0`) on the day this
  # catalog entry was added. `exporter-metrics-otlp-grpc` is provisioned
  # here per design.md §6's package table — A7 (metrics, R59/OR5) is its
  # first real caller (`apps/orders`/`apps/gateway`'s `tracing.ts`
  # bootstraps, widened to configure `NodeSDK`'s `metricReaders` alongside
  # the existing trace exporter).
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/sdk-node": ^0.221.0
  "@opentelemetry/exporter-trace-otlp-grpc": ^0.221.0
  "@opentelemetry/exporter-metrics-otlp-grpc": ^0.221.0
  "@opentelemetry/instrumentation-http": ^0.221.0
  "@opentelemetry/resources": ^2.10.0
  "@opentelemetry/semantic-conventions": ^1.43.0
  # Test-only: a bare `NodeTracerProvider` + `InMemorySpanExporter` +
  # `AsyncLocalStorageContextManager`, registered directly by each trace
  # test (never `sdk-node`'s own OTLP network exporter) — design.md §8's
  # "proven against OTel's own InMemorySpanExporter... no live collector
  # needed."
  "@opentelemetry/sdk-trace-base": ^2.10.0
  "@opentelemetry/sdk-trace-node": ^2.10.0
  "@opentelemetry/context-async-hooks": ^2.10.0
  "@opentelemetry/core": ^2.10.0
  # A7 (metrics, R59/OR5) — `MeterProvider`/`PeriodicExportingMetricReader`
  # for production (paired with `exporter-metrics-otlp-grpc` above) AND
  # `InMemoryMetricExporter` for every metrics test (design.md §8's same
  # "no live collector needed" convention, mirrored from the trace SDKs
  # above). Peer-compatible with `api@1.9.1` (`sdk-metrics@2.10.0` requires
  # `api` `>=1.9.0 <1.10.0`), verified before pinning.
  "@opentelemetry/sdk-metrics": ^2.10.0

minimumReleaseAgeExclude:
  - '@nuxt/test-utils@4.2.0'
  - '@vue/test-utils@2.5.0'
  - happy-dom@20.11.10
